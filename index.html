<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gshort.net · Free URL Shortener</title>
    
    <style>
        /* বেসিক রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* মেইন কন্টেইনার */
        .shortener-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        /* ব্র্যান্ড টেক্সট */
        .brand-title {
            font-size: 36px;
            color: #1e293b;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .brand-title span {
            color: #2563eb;
        }

        .brand-subtitle {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 35px;
        }

        /* ইনপুট গ্রুপ এবং বাটন লেআউট */
        .input-group {
            display: flex;
            gap: 10px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: #2563eb;
            background: #fff;
        }

        .input-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 15px;
            font-size: 16px;
            outline: none;
            color: #334155;
        }

        .btn-shorten {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-shorten:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* রেজাল্ট বক্স স্টাইল */
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        .result-label {
            font-size: 14px;
            color: #166534;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-field {
            display: flex;
            gap: 10px;
        }

        .result-field input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            color: #1e293b;
            font-weight: 500;
        }

        .btn-copy {
            background: #10b981;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #059669;
        }

        .success-text {
            font-size: 13px;
            color: #15803d;
            margin-top: 6px;
            font-weight: 500;
        }

        /* হিডেন ক্লাস */
        .hidden {
            display: none !important;
        }

        /* ফুটার লিঙ্ক */
        .footer-links {
            margin-top: 40px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            margin: 0 5px;
        }

        .copyright {
            margin-top: 15px;
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .input-group {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
            }
            .input-group input {
                background: #fff;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                margin-bottom: 10px;
            }
            .btn-shorten {
                padding: 14px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="shortener-container">
        <!-- ব্র্যান্ড হেডার -->
        <h1 class="brand-title">Gshort<span>.net</span></h1>
        <p class="brand-subtitle">আপনার বড় লিঙ্কগুলোকে মুহূর্তেই ছোট এবং সচল করুন।</p>

        <!-- শর্টনার ফর্ম -->
        <div class="shortener-form">
            <div class="input-group">
                <input type="url" id="long-url" placeholder="এখানে আপনার বড় লিঙ্কটি পেস্ট করুন..." required>
                <button id="shorten-btn" class="btn-shorten">Shorten URL</button>
            </div>
        </div>

        <!-- রেজাল্ট সেকশন -->
        <div id="result-box" class="result-container hidden">
            <p class="result-label">আপনার সচল শর্ট লিঙ্ক তৈরি হয়েছে:</p>
            <div class="result-field">
                <input type="text" id="shortened-url" readonly value="">
                <button id="copy-btn" class="btn-copy">Copy</button>
            </div>
            <p id="copy-success" class="success-text hidden">✓ লিঙ্কটি কপি হয়েছে!</p>
        </div>

        <!-- ফুটার সেকশন -->
        <div class="footer-links">
            <a href="#">Privacy</a> • <a href="#">Terms</a> • <a href="#">Report Abuse</a>
            <p class="copyright">© 2026 Gshort.net</p>
        </div>
    </div>

    <!-- এপিআই সমৃদ্ধ জাভাস্ক্রিপ্ট কোড -->
    <script>
        document.getElementById('shorten-btn').addEventListener('click', function() {
            const longUrlInput = document.getElementById('long-url');
            const longUrl = longUrlInput.value.trim();
            const shortenBtn = document.getElementById('shorten-btn');
            const resultBox = document.getElementById('result-box');
            const shortenedUrlField = document.getElementById('shortened-url');

            if (longUrl === "") {
                alert("দয়া করে একটি সঠিক লিঙ্ক প্রদান করুন।");
                return;
            }

            // বাটন লোডিং স্টেট
            shortenBtn.innerText = "Shortening...";
            shortenBtn.disabled = true;

            // ফ্রি এবং ওপেন API ব্যবহার করে লিঙ্ক রিডাইরেকশন সচল করা
            const apiUrl = `https://is.gd{encodeURIComponent(longUrl)}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.shorturl) {
                        resultBox.classList.remove('hidden');
                        shortenedUrlField.value = data.shorturl; // এই লিঙ্কটি ক্লিক করলেই কাজ করবে
                    } else {
                        alert("লিঙ্কটি শর্ট করতে সমস্যা হয়েছে। দয়া করে সঠিক ইউআরএল দিন।");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("সার্ভার সমস্যা! আবার চেষ্টা করুন।");
                })
                .finally(() => {
                    shortenBtn.innerText = "Shorten URL";
                    shortenBtn.disabled = false;
                });
        });

        // কপি বাটন ফাংশন
        document.getElementById('copy-btn').addEventListener('click', function() {
            const copyText = document.getElementById('shortened-url');
            copyText.select();
            copyText.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(copyText.value).then(() => {
                const successMsg = document.getElementById('copy-success');
                successMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    successMsg.classList.add('hidden');
                }, 3000);
            });
        });
    </script>
</body>
</html>
