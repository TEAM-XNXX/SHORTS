<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি ইউআরএল শর্টনার</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 5px; display: none; }
        a { color: #007bff; font-weight: bold; font-size: 18px; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔗 ফ্রি ইউআরএল শর্টনার</h2>
    <input type="url" id="longUrl" placeholder="আপনার বড় লিঙ্কটি দিন...">
    <br>
    <button onclick="short()">লিঙ্ক ছোট করুন</button>
    <div class="result" id="box">
        <p><strong>ছোট লিঙ্ক:</strong></p>
        <a id="res" href="#" target="_blank"></a>
    </div>
</div>
<script>
    async function short() {
        var url = document.getElementById('longUrl').value.trim();
        if(!url) return alert('লিঙ্ক দিন!');
        document.getElementById('res').innerText = "তৈরি হচ্ছে...";
        document.getElementById('box').style.display = "block";
        try {
            var rep = await fetch("https://shrtco.de" + encodeURIComponent(url));
            var data = await rep.json();
            if(data.ok) {
                document.getElementById('res').href = data.result.full_short_link;
                document.getElementById('res').innerText = data.result.full_short_link;
            } else {
                // অল্টারনেট ফ্রি ব্যাকআপ মেথড যদি মেইন সার্ভার জ্যাম থাকে
                document.getElementById('res').href = "https://is.gd" + encodeURIComponent(url);
                document.getElementById('res').innerText = "লিঙ্ক রেডি! এখানে ক্লিক করুন";
            }
        } catch(e) {
            document.getElementById('res').href = "https://is.gd" + encodeURIComponent(url);
            document.getElementById('res').innerText = "লিঙ্ক রেডি! এখানে ক্লিক করুন";
        }
    }
</script>
</body>
</html>
