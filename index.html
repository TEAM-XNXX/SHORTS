<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Gshort.net</title>
    <!-- সিএসএস ফাইল লিঙ্ক -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <!-- গুগলের লোগো (CSS দিয়ে সাইজ ফিক্স করা হয়েছে) -->
        <div class="logo-area">
            <svg class="google-logo" viewBox="0 0 24 24" width="100%" height="100%">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
        </div>

        <!-- গুগল সাইন-ইন বাটন -->
        <a href="#" class="btn-google">
            <img src="https://gstatic.com" alt="Google">
            Continue with Google
        </a>

        <div class="separator">
            <span>or continue with email</span>
        </div>

        <!-- লগইন ফর্ম -->
        <form>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">
                Log in
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
            </button>
        </form>

        <!-- রেজিস্টার লিঙ্ক -->
        <div class="footer-links">
            No account? <a href="#">Register</a>
        </div>
    </div>

</body>
</html>
