<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি ইউআরএল শর্টনার</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="url"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #218838; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .result-box a { color: #007bff; font-weight: bold; text-decoration: none; }
        .copy-btn {
            background-color: #007bff;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔗 ফ্রি ইউআরএল শর্টনার</h2>
    <input type="url" id="longUrl" placeholder="আপনার বড় লিঙ্কটি এখানে পেস্ট করুন..." required>
    <br>
    <button onclick="shortenUrl()">লিঙ্ক ছোট করুন</button>

    <div class="result-box" id="resultBox">
        <p><strong>আপনার ছোট লিঙ্ক:</strong></p>
        <a id="shortenedUrl" href="#" target="_blank"></a>
        <br>
        <button class="copy-btn" onclick="copyLink()">লিঙ্ক কপি করুন</button>
    </div>
</div>

<script>
    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultBox = document.getElementById('resultBox');
        const shortenedUrlAnchor = document.getElementById('shortenedUrl');

        if (!longUrl) {
            alert('দয়া করে একটি সঠিক লিঙ্ক দিন!');
            return;
        }

        shortenedUrlAnchor.innerText = "লোডিং...";
        resultBox.style.display = "block";

        try {
            // TinyURL এর ফ্রি ও ওপেন API ব্যবহার করা হয়েছে
            const response = await fetch(`https://tinyurl.com{encodeURIComponent(longUrl)}`);
            
            if (response.ok) {
                const shortUrl = await response.text();
                shortenedUrlAnchor.href = shortUrl;
                shortenedUrlAnchor.innerText = shortUrl;
            } else {
                shortenedUrlAnchor.innerText = "লিঙ্ক তৈরি করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
            }
        } catch (error) {
            shortenedUrlAnchor.innerText = "নেটওয়ার্ক সমস্যা! পরে চেষ্টা করুন।";
        }
    }

    function copyLink() {
        const linkText = document.getElementById('shortenedUrl').innerText;
        navigator.clipboard.writeText(linkText);
        alert('লিঙ্কটি কপি করা হয়েছে!');
    }
</script>

</body>
</html>
