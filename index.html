<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gshort Free URL Shortener</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            color: #1a202c;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p.subtitle {
            color: #718096;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="url"] {
            width: 90%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        input[type="url"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 96%;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #edf2f7;
            border-radius: 8px;
            display: none;
            text-align: left;
        }
        .result-box p {
            margin: 0 0 8px 0;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }
        .link-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .result-box a {
            color: #2b6cb0;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            margin-left: 10px;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background-color: #38a169;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 Gshort URL Shortener</h1>
    <p class="subtitle">লগইন ছাড়াই আনলিমিটেড বড় লিঙ্ক নিমেষেই ছোট করুন ফ্রি-তে।</p>
    
    <div class="input-group">
        <input type="url" id="longUrl" placeholder="আপনার বড় লিঙ্কটি এখানে পেস্ট করুন..." required>
    </div>
    
    <button onclick="shortenUrl()">Shorten URL</button>

    <div class="result-box" id="resultBox">
        <p>Your Shortened URL:</p>
        <div class="link-container">
            <a id="shortenedUrl" href="#" target="_blank">তৈরি হচ্ছে...</a>
            <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
        </div>
    </div>
</div>

<script>
    async function shortenUrl() {
        var longUrl = document.getElementById('longUrl').value.trim();
        var resultBox = document.getElementById('resultBox');
        var shortenedUrlAnchor = document.getElementById('shortenedUrl');

        if (!longUrl) {
            alert('দয়া করে একটি সঠিক লিঙ্ক দিন!');
            return;
        }

        shortenedUrlAnchor.innerText = "লিঙ্ক ছোট হচ্ছে...";
        shortenedUrlAnchor.href = "#";
        resultBox.style.display = "block";

        try {
            // ব্রাউজারে কেস-সেনসিটিভ অক্ষরের ত্রুটি এড়াতে সরলীকৃত এপিআই কল করা হয়েছে
            var target = "https://is.gd" + encodeURIComponent(longUrl);
            var response = await fetch("https://allorigins.win" + encodeURIComponent(target));
            
            if (response.ok) {
                var data = await response.json();
                var shortUrl = data.contents.trim();
                
                if (shortUrl.includes("is.gd")) {
                    shortenedUrlAnchor.href = shortUrl;
                    shortenedUrlAnchor.innerText = shortUrl;
                } else {
                    shortenedUrlAnchor.innerText = "ভুল লিঙ্ক! দয়া করে সঠিক লিঙ্ক দিন।";
                }
            } else {
                shortenedUrlAnchor.innerText = "আবার চেষ্টা করুন।";
            }
        } catch (error) {
            shortenedUrlAnchor.innerText = "সাময়িক সমস্যা! আবার চেষ্টা করুন।";
        }
    }

    function copyLink() {
        var linkText = document.getElementById('shortenedUrl').innerText;
        if(linkText !== "লিঙ্ক ছোট হচ্ছে..." && linkText !== "সাময়িক সমস্যা! আবার চেষ্টা করুন।") {
            navigator.clipboard.writeText(linkText);
            alert('লিঙ্কটি সফলভাবে কপি করা হয়েছে!');
        }
    }
</script>

</body>
</html>
