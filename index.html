<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি ইউআরএল শর্টনার</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="url"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #218838; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
        .result-box a { color: #007bff; font-weight: bold; text-decoration: none; font-size: 18px; }
        .copy-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔗 ফ্রি ইউআরএল শর্টনার</h2>
    <input type="url" id="longUrl" placeholder="আপনার বড় লিঙ্কটি এখানে পেস্ট করুন..." required>
    <br>
    <button onclick="shortenUrl()">লিঙ্ক ছোট করুন</button>

    <div class="result-box" id="resultBox">
        <p><strong>আপনার ছোট লিঙ্কটি তৈরি:</strong></p>
        <a id="shortenedUrl" href="#" target="_blank">লোডিং...</a>
        <br>
        <button class="copy-btn" id="copyBtn" onclick="copyLink()" style="display:none;">লিঙ্ক কপি করুন</button>
    </div>
</div>

<script>
    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const resultBox = document.getElementById('resultBox');
        const shortenedUrlAnchor = document.getElementById('shortenedUrl');
        const copyBtn = document.getElementById('copyBtn');

        if (!longUrl) {
            alert('দয়া করে একটি সঠিক লিঙ্ক দিন!');
            return;
        }

        shortenedUrlAnchor.innerText = "লিঙ্ক তৈরি হচ্ছে...";
        shortenedUrlAnchor.href = "#";
        resultBox.style.display = "block";
        copyBtn.style.display = "none";

        try {
            // Vercel-এর নিজস্ব সার্ভারলেস এনভায়রনমেন্টে এই ফ্রি প্রক্সিটি ১০০% কাজ করবে
            const response = await fetch(`https://allorigins.win{encodeURIComponent('https://tinyurl.com' + encodeURIComponent(longUrl))}`);
            
            if (response.ok) {
                const data = await response.json();
                const shortUrl = data.contents.trim();
                
                if (shortUrl.includes("tinyurl.com")) {
                    shortenedUrlAnchor.href = shortUrl;
                    shortenedUrlAnchor.innerText = shortUrl;
                    copyBtn.style.display = "inline-block";
                } else {
                    shortenedUrlAnchor.innerText = "ভুল লিঙ্ক! দয়া করে সঠিক লিঙ্ক দিন।";
                }
            } else {
                shortenedUrlAnchor.innerText = "আবার চেষ্টা করুন।";
            }
        } catch (error) {
            shortenedUrlAnchor.innerText = "সাময়িক সমস্যা! আবার চেষ্টা করুন।";
        }
    }

    function copyLink() {
        const linkText = document.getElementById('shortenedUrl').innerText;
        navigator.clipboard.writeText(linkText);
        alert('লিঙ্কটি কপি করা হয়েছে!');
    }
</script>

</body>
</html>
